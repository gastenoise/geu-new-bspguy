name: CI Multiplatform & Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Release
            arch: x64
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            generator: "Unix Makefiles"
            arch: x64
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            generator: "Unix Makefiles"
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev \
            libglu1-mesa-dev libglfw3-dev libglew-dev libxkbcommon-dev

      - name: Setup Clang Environment
        if: matrix.compiler == 'clang'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends clang
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -A ${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Install / Stage Artifacts
        run: cmake --install build --prefix dist/revamped-newbspguy --config ${{ matrix.build_type }}

      - name: Smoke Tests (Windows CLI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/revamped-newbspguy/bspguy.exe"
          & $exe info demo/demo_vis_editor.bsp
          & $exe exportwad demo/demo_vis_editor.bsp
          & $exe simplify demo/demo_vis_editor.bsp -model 0 -o test_simplified.bsp

      - name: Smoke Tests (Linux CLI)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/revamped-newbspguy/bspguy
          ./dist/revamped-newbspguy/bspguy info demo/demo_vis_editor.bsp
          ./dist/revamped-newbspguy/bspguy exportwad demo/demo_vis_editor.bsp
          ./dist/revamped-newbspguy/bspguy simplify demo/demo_vis_editor.bsp -model 0 -o test_simplified.bsp

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bspguy-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: dist/revamped-newbspguy/
          retention-days: 14
