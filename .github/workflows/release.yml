name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag to release (e.g. v1.0 or v1.0.0)'
        required: true
        default: 'v1.0'
      release_title:
        description: 'Release Title (leave empty for default title)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build & Package
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          cmake --install build --prefix dist/revamped-newbspguy --config Release
          Compress-Archive -Path dist/revamped-newbspguy/* -DestinationPath "revamped-newbspguy-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: revamped-newbspguy-windows-x64.zip
          retention-days: 1

  build-linux:
    name: Package Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev \
            libglu1-mesa-dev libglfw3-dev libglew-dev libxkbcommon-dev

      - name: Build & Package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          cmake --install build --prefix dist/revamped-newbspguy --config Release
          cd dist
          tar -czvf ../revamped-newbspguy-linux-x64.tar.gz revamped-newbspguy/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: revamped-newbspguy-linux-x64.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag & Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=${{ github.event.inputs.is_prerelease }}" >> $GITHUB_OUTPUT
            if [ -n "${{ github.event.inputs.release_title }}" ]; then
              echo "RELEASE_NAME=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            else
              echo "RELEASE_NAME=revamped-newbspguy ${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=revamped-newbspguy ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag.outputs.PRERELEASE == 'true' }}
          generate_release_notes: true
          make_latest: ${{ steps.tag.outputs.PRERELEASE != 'true' }}
          files: |
            release-packages/revamped-newbspguy-windows-x64.zip
            release-packages/revamped-newbspguy-linux-x64.tar.gz
